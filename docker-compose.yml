services:
  db:
    image: postgres:16-alpine
    container_name: aim_postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: aim
      POSTGRES_PASSWORD: aim
      POSTGRES_DB: aim_command_center
    ports:
      - "5432:5432"
    volumes:
      - aim_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U aim -d aim_command_center"]
      interval: 5s
      timeout: 5s
      retries: 20

volumes:
  aim_pgdata:
